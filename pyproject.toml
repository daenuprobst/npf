[project]
name = "npf"
version = "0.2.0"
description = "Neural Petri Flow. Neural networks that remain Petri nets for every value of their weights"
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy",
    "scipy",
    "torch",
    "rdkit>=2026.3.6",
]

[dependency-groups]
dev = [
    "matplotlib",
    "networkx",
    "pillow",
    "drfp>=0.3.7",
    "pytest",
    "ortools>=9.15.6755",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/npf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
