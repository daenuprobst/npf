name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/npflow
    permissions:
      id-token: write  # Required for OIDC / Trusted Publishing
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Check that the tag is the version of the package
        run: |
          version=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)
          test "${GITHUB_REF_NAME}" = "v${version}" || { echo "tag ${GITHUB_REF_NAME} is not v${version}"; exit 1; }

      - name: Build package
        run: uv build

      - name: Map one reaction with the built wheel
        run: |
          uv venv /tmp/check --python 3.12
          VIRTUAL_ENV=/tmp/check uv pip install dist/*.whl
          /tmp/check/bin/npflow map "CC(=O)Cl.CN>>CC(=O)NC"

      - name: Publish package
        run: uv publish
