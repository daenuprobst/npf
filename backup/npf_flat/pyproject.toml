[project]
name = "npf"
version = "0.1.0"
description = "Neural Petri Flow: neural networks whose forward pass is a Petri net execution, evaluated against PGNN"
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy",
    "scipy",
    "torch",
    "matplotlib",
    "rdkit>=2026.3.6",
    "drfp>=0.3.7",
]

[tool.uv]
package = false
